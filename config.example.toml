# Copy to config.toml (or ~/.marginalia/config.toml) and edit.
# Resolution order: MARGINALIA_CONFIG -> ./config.toml -> ~/.marginalia/config.toml

[library]
# Where transcripts and the ledger live. Never inside the git repository.
path = "C:/youtube-agent/marginalia-library"

[providers]
# Transcript sources, tried in order. Only "ytdlp" exists today.
transcript_order = ["ytdlp"]

# Search sources, tried in order. The official API is primary; ytdlp_search is
# the overflow, used when the daily quota runs out or no key is configured.
search_order = ["youtube_api", "ytdlp_search"]

# YouTube Data API v3 key. Leave it unset to read YOUTUBE_API_KEY from the
# environment instead — the file wins when both are present.
# youtube_api_key = ""

# Daily unit allowance, checked locally before every request. Google's default
# is 10000, and one search costs 100 — so roughly 100 searches a day. Lower it
# to share the budget with something else; set it to 0 to force the overflow
# provider.
# youtube_daily_units = 10000

[llm]
# The model provider. Swapping is these three values and no code — see
# "Swapping the model provider" in README.md. Any OpenAI-compatible endpoint
# works: Groq, OpenRouter, DeepSeek, Together, or local Ollama / vLLM.
#
# Several provider changes have exercised this boundary. One also required
# deleting a hardcoded `temperature=0` from llm.py, which is the reason `_send`
# now names only model/messages/max_tokens/user/extra (RULES.md rule 7).
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"

# Leave unset to read MARGINALIA_LLM_API_KEY from the environment instead.
# The file wins when both are present.
# api_key = ""

# timeout_s = 420

# Reasoning bills against max_tokens on a thinking provider, so a high effort
# setting can spend the entire budget on reasoning and leave nothing for the
# answer. Measured on deepseek-v4-flash: reasoning_effort="max" with
# max_tokens=2000 produced 2000 reasoning tokens and empty content. [note] sets
# its own, higher, ceiling — that is the one that matters.
# max_tokens = 8192

# Merged into every request body. Where a provider-wide setting lives when one
# is needed. Nothing in the code reads inside it.
#
# It is empty on purpose, and the temptation to fill it with `temperature = 0`
# is exactly what broke the first provider swap: kimi-k3 fixed temperature at
# 1.0 and returned HTTP 400 for any request that named it at all. DeepSeek
# accepts temperature in every mode, so the field is portable again — but that
# is a fact about this provider, not about the baseline, which is why it lives
# in a task block below rather than here.
#
# A different provider may well want something here. That is what it is for.
# extra = { }

[llm.limits]
# The provider's ceiling. The limiter blocks to stay under it rather than
# erroring — a discovery run legitimately needs more than this many requests.
# Set it conservatively: too low costs patience, too high costs failed runs.
requests_per_minute = 20

# Candidates judged per stage-1 request. Under per-request credits this saved
# requests; under per-token billing it sends the brief once per batch instead
# of once per candidate. Set to 1 and behaviour is identical either way.
judge_batch_size = 10

[llm.pricing]
# Per million tokens, for the cost estimate and the max_cost_usd guard. In
# config because rates change and the next provider's will differ. DeepSeek V4
# flash, cache-miss rates: ~21x cheaper in and ~54x cheaper out than kimi-k3's
# 3.00/15.00, which is what turned regenerating the whole library from a
# decision into a routine operation.
input_per_million = 0.14
output_per_million = 0.28

# -- thinking, per task -------------------------------------------------------
#
# Merged into that task's request body and passed through untouched. A provider
# without the feature simply has no blocks here, and every request is the
# portable baseline.
#
# The split below is by MODE, not by degree: thinking off for the two calls that
# classify, maximum thinking for the four that reason. That is a DeepSeek-shaped
# choice — thinking-off is the only genuinely cheap tier this provider has.
#
# Everything that follows was VERIFIED against the API, not read from
# documentation, because a silently ignored field looks identical to a working
# one. Reproduce it before trusting it on the next provider.
#
# reasoning_effort accepts exactly seven values. The API enumerates them itself
# when given an invalid one, which is also the cheapest way to prove the field
# is arriving at all:
#
#     unknown variant `banana`, expected one of
#     `none`, `minimal`, `low`, `medium`, `high`, `xhigh`, `max`
#
# These are distinct tiers, not aliases for each other. Each loads a different
# prompt scaffold, visible in prompt_tokens for an identical message:
# none/low = 69, medium/high = 148, max = 161. Setting `low` does take effect.
# high vs max also differ in output: 3319 vs 4091 mean tokens over three
# samples, 31s vs 39s.
#
# `thinking = { type = "disabled" }` is the documented equivalent of
# `reasoning_effort = "none"` and behaves identically — same prompt_tokens, zero
# reasoning_tokens, no reasoning_content. One field across every task reads
# better than a flat key on some and a nested table on others, so this file uses
# reasoning_effort throughout. `thinking.type` accepts `adaptive`, `enabled`,
# `disabled`.
#
# Do not rely on an undocumented provider-specific flag to disable thinking. A
# server may return HTTP 200 while silently ignoring it, leaving reasoning fully
# on. Use the documented shape for the target provider and verify the response.

# Thinking off, low variance — NOT deterministic, and the difference matters.
#
# Same prompt, eight samples:
#     temperature = 2          8 distinct / 8
#     no temperature at all    8 distinct / 8
#     temperature = 0          3 distinct / 8   (5 identical)
#     temperature = 0 + seed   2 distinct / 8   (7 identical)
#
# temperature is honoured — it is not being dropped — but it does not buy
# determinism. Judging the same ten candidates three times gave the same verdict
# on nine and flipped the tenth between MAYBE and YES. The residue is the
# serving layer, not this file: V4 is a mixture-of-experts model served with an
# fp8 KV cache, and batch-dependent expert routing makes even greedy decoding
# non-reproducible. No setting available here closes that gap.
#
# So variance is now confined to genuinely borderline candidates rather than
# unbounded — a real improvement on kimi-k3, where temperature was rejected
# outright and thinking could not be switched off. It is not repeatability. The
# decisions table still records what the judge concluded on that occasion, and
# rule 8 (unparseable becomes MAYBE, never NO) matters more here, not less.
[llm.tasks.judge_metadata]
extra = { reasoning_effort = "none", temperature = 0, seed = 42 }

[llm.tasks.expand_queries]
extra = { reasoning_effort = "none", temperature = 0, seed = 42 }

# Thinking on for the four that reason rather than classify — but NOT all at
# maximum, and the reason is the most important thing on this page.
#
# `max` does not self-limit. It expands to fill whatever token budget it is
# given and then stops on finish_reason="length", so it succeeds only where the
# task is intrinsically short enough to finish first. Measured, same prompts:
#
#   task            effort   finish    reasoning   content
#   judge_opening   max      stop            685      187ch   ok   (since removed)
#   write_brief     max      stop          2,256    2,969ch   ok
#   review_brief    max      length        8,192        0ch   EMPTY
#   review_brief    high     stop          2,320    2,432ch   ok
#   write_note      max      length       29,636   truncated  5 of 7 sections
#   write_note      high     length       32,768        0ch   EMPTY
#   write_note      low      stop         12,271   12,838ch   ok
#
# Raising max_tokens does not fix it — write_note at max produced 108k chars of
# reasoning under a 32,768 ceiling and 204k under 65,536, hitting "length" both
# times. The ladder is also not monotonic: `high` was worse than `max` for
# write_note, spending the whole budget on reasoning for no output at all.
#
# So "the hardest task deserves the most thinking" is the wrong instinct on
# this provider. Match effort to how much the task has to WRITE, not to how
# hard it is. And verify after any prompt grows: write_brief at max is
# comfortable today, not safe by construction.
# B3's stage 2: the whole transcript, thinking OFF.
#
# Not a cost saving — a shape argument. With the complete evidence in hand the
# model is reading and deciding, not inferring beyond what it was given, and a
# constrained five-line classification has nothing to reason its way toward.
#
# Two consequences, both wanted. `temperature = 0` becomes available, so the
# same transcript tends to the same verdict (tends, not guarantees: MoE routing
# under fp8 is not deterministic, as measured). And the runaway-reasoning
# failure that returned an empty note after spending 32,768 tokens thinking
# becomes structurally impossible — there is no budget to run away with.
#
# Measured on the longest transcript in the library (14,341 words, 40,825 input
# tokens): finish_reason=stop, 132 output tokens, 11.3s, $0.0058. Across ten
# real videos, 2.5s and 0.09c each.
[llm.tasks.judge_full]
extra = { reasoning_effort = "none", temperature = 0 }

[llm.tasks.write_brief]
extra = { reasoning_effort = "max" }

[llm.tasks.review_brief]
extra = { reasoning_effort = "high" }

# B4. Once per topic, before anything is searched. Working out what a subject
# is *called* — its subtopics, its jargon, the tools and people identified with
# it — is the one call whose output decides what the search is even capable of
# returning.
#
# `low`, and measured rather than chosen. This is the same shape write_note is,
# and it fails the same way: a structured document of a dozen query blocks is
# exactly what this provider's reasoning does not terminate on.
#
#   effort   finish    output tokens   result
#   high     length            8,192   EMPTY — 71s and nothing came back
#   low      stop              3,709   valid: 8 queries, 26 vocabulary terms, 27s
#
# The `high` run is not hypothetical; it was the first real call this phase
# made. The map guard caught it — a truncated reply is discarded rather than
# parsed, because a half-read vocabulary looks like the subject's full extent —
# so the cost of getting this wrong is a narrower run, not a wrong one.
#
# The ladder is not monotonic on this task, which is the third time that has
# been true here. "The most important call deserves the most thinking" is the
# wrong instinct on this provider whenever the output is long and structured.
[llm.tasks.map_territory]
extra = { reasoning_effort = "low" }

# The search plan (`[discover] search_source = "plan"`) does the map's job in a
# new shape: one long structured reply per run, an item block per PART. That is
# the shape every effort above `low` failed to finish on this provider, so it
# starts at the map's measured effort. Without this table the plan uses the
# map's, not the global default.
[llm.tasks.search_plan]
extra = { reasoning_effort = "low" }

# Step 4's two short calls: the lookup's queries, and the digest of what came
# back. Short lines, no reasoning needed — the shape of query expansion.
[llm.tasks.web_context_queries]
extra = { reasoning_effort = "none", temperature = 0, seed = 42 }

[llm.tasks.web_context_digest]
extra = { reasoning_effort = "none", temperature = 0, seed = 42 }

# Once per video, reading a whole transcript, producing the artifact every
# later question is answered from. The highest-consequence call in the system,
# and the one that must have the LEAST thinking — see the table above. `low`
# still spends ~11.7k reasoning tokens on a 101k-char transcript and returns a
# valid note in about two minutes for roughly a cent, so this is not a token
# gesture. Escalating to deepseek-v4-pro does not help: pro at max effort
# reasoned 10,159 tokens and returned an empty message, so the failure is max
# thinking on a long structured output, not flash running out of capacity.
# B5. Once at the end of every round but the last. It reads what the round found
# and decides what the next one should look for.
#
# `low`, and the fourth measurement of the same shape rather than a guess. This
# writes a long structured document — a coverage assessment, map revisions and
# a set of queries — which is precisely the shape write_note, review_brief and
# map_territory all failed at above `low` on this provider.
#
# Measured on one real round (25 rejections, 2 kept), same input each time:
#
#   effort   finish    output   latency   result
#   low      stop       2,618     30.6s   valid, 5 queries, 6 coverage items
#   low      stop       2,338     22.0s   valid, 5 queries, 6 coverage items
#   high     stop       7,670     75.7s   valid — 522 tokens under the ceiling
#   high     length     8,192     70.7s   TRUNCATED, discarded
#
# `high` is not merely expensive here, it is *unreliable*: it converged once
# with 6% headroom and hit the ceiling on the next identical call. And that was
# a small round — a real one carries more rejections, so the margin only gets
# worse. The truncation guard held both times (a fragment is discarded rather
# than parsed, because a half-read coverage assessment reads as a complete
# account of what the brief is missing), so the cost of being wrong here is a
# round that falls back to expansion rather than a wrong plan.
#
# Fourth non-monotonic ladder on this provider. "The most important call
# deserves the most thinking" has now been wrong four times out of four
# whenever the output is long and structured.
# The library-coverage audit, run once before round one over every note on disk.
# `low`, on the rule PLAN.md now states: on this provider a task producing long
# structured output needs a low effort setting *and* a generous ceiling, because
# the reasoning is what overruns and it bills against max_tokens. Fifth task of
# that shape; the first four were measured the hard way.
[llm.tasks.assess_library]
extra = { reasoning_effort = "low" }

[llm.tasks.plan_round]
extra = { reasoning_effort = "low" }

# M7 stage 1: choosing which whole notes the answering call reads. Thinking
# OFF, and the same shape argument as judge_full: the model is reading a list
# and marking it, not inferring beyond what it was given, so there is nothing
# to reason toward. It also makes the runaway-reasoning failure impossible on
# the one call whose truncation would silently narrow an answer.
[llm.tasks.select_notes]
extra = { reasoning_effort = "none", temperature = 0, seed = 42 }

[llm.tasks.write_note]
extra = { reasoning_effort = "low" }

# The marking pass after each note: it lists the note's unmarked outside
# statements and the code wraps them. Its reply is a few hundred tokens; with
# no block here the provider's default thinking applied and 96-97% of the
# pass's output was reasoning. Measured on the same three drafts (unmarked
# outside statements left, and marked spans that were record, per note):
#
#   effort   prompt  output tokens   cost/pass   unmarked   marked record
#   default  v1      19.5k-24.4k      $0.0145    (not audited on these)
#   low      v3      15.6k-19.0k      $0.0126    2, 2, 0    2, 0, 3
#   low      v2      10.1k-16.7k      $0.0097    4, 2, 0    1, 5, 7
#   none     v3       0.5k-1.4k       $0.0025    9, 1, 3    0, 25, 13
#   none     v2       0.9k-1.5k       $0.0026    1, 1, 3    19, 20, 16
#
# The drafts had 10, 9 and 11 unmarked. With no reasoning the pass is cheap and
# erratic: it wraps whole Claims bullets, which ask would then discount. `low`
# is the cheapest setting that keeps both counts near 2 — and it is not cheap:
# the note costs about $0.0063, so note plus pass is about 3x the note alone.
[llm.tasks.mark_note]
extra = { reasoning_effort = "low" }

[discover]
# Stopping conditions. Whichever fires first wins, and which one fired is
# recorded in runs.stopped_because.
max_rounds = 3
max_videos = 25
max_requests = 120
# Rounds finding nothing new before the loop gives up.
quiet_rounds = 2

# The real guard under per-token billing: a request count says nothing about
# what a batch of fifty candidates cost versus a batch of five. 0 disables it.
max_cost_usd = 1.50

# Stage 2's own output ceiling. Unset, it is `[llm] max_tokens`. Worth setting
# only with a reasoning effort on `[llm.tasks.judge_full]`: at `low`, replayed
# stage-2 replies had a median of 1,643 output tokens and a maximum of 8,192 —
# one reasoned to the global ceiling and returned nothing.
# judge_full_max_tokens = 16384

# Seconds between transcript fetches. YouTube throttles a burst — a run that
# pulled six videos quickly had its next thirteen fetches all fail within nine
# seconds. Real backoff belongs to M3; this keeps a run polite.
fetch_delay_s = 3.0

# Believe the search provider when it says a video has no caption track, and
# skip the download.
#
# Off, and that is a measurement rather than caution. Against the 40 videos in
# this project's library whose caption outcome is already known, the YouTube
# API reported `caption: "false"` for 31 of the 37 that yielded a perfectly good
# transcript. It is not a noisy signal — it is an exact one answering a
# different question: it counts *manually uploaded* caption tracks, and got all
# 6 manual ones right and all 31 auto-generated ones wrong. yt-dlp reads
# auto-captions; the API does not count them.
#
# Turning this on today would route most of what discovery finds into
# `needs_asr`, whose worker is M4 and does not exist. Worth revisiting when it
# does, or if a provider starts reporting auto-captions honestly.
trust_caption_hint = false

# How wide each round casts. These multiply: queries × results is the candidate
# count, and candidates ÷ judge_batch_size is the request count. Lower them on a
# slow or heavily queued provider.
#
# 9, matching `DEFAULT_QUERIES_PER_ROUND`. The two disagreed from the commit
# that introduced them — 9 in code, 6 here — which meant the width of a round
# depended on whether a config file happened to name the key. 9 is the side to
# settle on: a wider search serves the asymmetry the whole judge is built on,
# where a video never surfaced is the one failure nothing downstream can see.
queries_per_round = 9
results_per_query = 10

# B4. Queries the territory map writes, on top of `queries_per_round`, and they
# run once — in round one only. Both sets run deliberately: the brief's own
# expansion is what discovery did before the map existed, and keeping it is what
# lets `queries.origin` answer "did the map find anything the old expansion
# would not have?" from the ledger rather than from an opinion.
#
# It costs real quota. Every query is a search, and on the official API a search
# is 100 units out of 10,000 a day — so this adds to the round rather than
# replacing part of it. Set it to 1 to keep the mechanism and shrink the bill.
territory_queries = 8

# What writes round one's planned queries: `map` (the territory map above) or
# `plan` (the search plan, written from the brief's PARTS: per item, what a
# video that satisfies it is like, how such videos are titled, how titles are
# written in each language the brief names, and queries tagged with the item).
# Both are asked for `territory_queries` queries, so a comparison runs at the
# same quota. A plan that cannot be used falls back to the map, never to
# nothing. `plan` is the default. Measured on a live, same-day comparison of
# round one: on a topic whose parts were all held, the plan's 8 queries brought 9
# keepers on missing items and the map's brought 0 (its 12 keepers were general
# explainers of held parts); on a topic whose missing items barely appear on the
# video site, neither found any.
# `map` stays available here and through `marg discover --search-source map`.
search_source = "plan"

# Step 4: a few web searches before the plan, aimed at what the library lacks,
# digested into short tagged lines for the plan's CURRENT CONTEXT — how the
# subject is named and titled today. Used only to plan: no judge, note or answer
# ever sees it. On the model account's own key (DeepSeek's Search API, $0.75 per
# 1,000 searches that return something), plus two short model calls. A failed
# lookup never stops a run. Off until a live comparison; `marg discover
# --web-context on` runs one without editing this file.
web_context = false
web_context_queries = 6
web_context_results = 10

# The library baseline: how many calls a fresh one makes. Disagreements between
# them resolve toward missing (a thing wrongly marked missing costs one query; one
# wrongly marked held is never searched for), and are counted. A baseline is
# stored and reused, with no call, while the approved brief, the notes and their
# judge reasons, the prompt and these settings are unchanged. 1 is one call, as
# before.
baseline_calls = 2

# B5. Queries the planner writes at the end of each round, for the next one.
# They run *first* in that round — they were written against the gaps the last
# round actually left open — and `queries_per_round` still runs alongside them,
# so the ledger can answer whether the planner found anything expansion would
# not have.
planner_queries = 6

[note]
# The note pass reads whole transcripts, so its ceiling is a different number
# from discovery's even though it is the same guard. 0 disables it.
max_cost_usd = 5.0

# A transcript longer than this is logged and skipped, never split. Chunking
# would produce something that looks like a note and is not: the value of a
# note is the reading that spans four minutes and notices the contradiction.
# Characters rather than tokens, because counting tokens needs a tokenizer and
# a tokenizer is a provider-shaped dependency. ~4 chars per token.
max_transcript_chars = 1000000

# Room for a full note plus, on a thinking provider, the reasoning that bills
# against the same ceiling. Raised from 8192 for DeepSeek at reasoning_effort
# = "max": the budget is shared between thinking and the note rather than
# reserved for the note. A truncated reply loses a required section and
# `validate_note` fails it — retryable, but three failures in a row stop the
# run, so an under-set ceiling here is a run-killer rather than a quality
# issue. A ceiling, not a target; unused headroom costs nothing per-token.
max_tokens = 32768

[ask]
# Answering a question from every note at once: a large fixed input and one
# answer out. Generous because reasoning bills against this ceiling and an
# answer that runs out of room mid-sentence is worse than one costing a cent
# more.
max_tokens = 32768

# Transcripts one question may open. Escalation is the model's decision, and
# this is the ceiling on that decision.
max_transcripts = 3

# Per transcript, when escalating.
max_transcript_chars = 120000

# The provider's context window, for the headroom guard. **Commented out on
# purpose, and there is no default.** A context limit is provider-specific, so
# a number shipped here would be one vendor's figure applied to whoever comes
# next - the same argument that leaves `llm.model` without a default.
#
# Unset, `ask` reports the size it is about to send and nothing else. Set, it
# warns above 80% and refuses above 100%, naming both numbers, before any
# request is made - running out of context is a cliff rather than a slope, and
# the other triggers for a selection layer are slopes you can watch.
#
# Measured on this library: 309 notes are ~875,000 input tokens. Against a
# 1,000,000-token window that is 87% and about 44 notes of room; against
# 1,310,720 it is 67% and about 153. One discovery run added 41.
# max_input_tokens = 1000000

# M7. The share of that ceiling note selection may fill. A policy rather than
# a provider fact, which is why this one has a default where the ceiling
# deliberately does not. Below it the whole library loads, which is the
# measured-better path; above it the selector runs and fills back up to here.
# The remaining quarter is the question, the prompt, and a transcript the model
# may open mid-answer - none of which the note estimate covers.
# select_budget_share = 0.75
